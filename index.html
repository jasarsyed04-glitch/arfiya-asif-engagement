<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Arfiya & Asif Ali — Engagement Ceremony"
  >

  <title>Arfiya & Asif Ali | You're Invited</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="landing">

  <!-- ✨ Background Sparkles -->
  <div class="sparkles"></div>

  <!-- 💍 Welcome Card -->
  <main class="welcome-card">

    <p class="eyebrow">
      A beautiful beginning
    </p>

    <h1>
      Arfiya <span>&amp;</span> Asif Ali
    </h1>

    <p class="subtitle">
      Engagement Ceremony
    </p>

    <!-- 💌 Envelope -->
    <div
      class="envelope"
      id="envelope"
      aria-label="Open invitation"
    >

      <div class="envelope-top"></div>

      <div class="envelope-body">
        <div class="seal">
          A&amp;A
        </div>
      </div>

    </div>

    <!-- ✨ Open Button -->
    <button
      class="gold-btn"
      id="openInvitation"
      type="button"
    >
      Open the Invitation ✨
    </button>

    <p class="hint">
      Tap to reveal your invitation
    </p>

  </main>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
